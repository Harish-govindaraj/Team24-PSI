# =====================================================
# PSI - Pharma Sales Intelligence
# =====================================================

spring.application.name=pharma-sales-intelligence

# --- Server ---
server.port=${PORT:8080}

# --- MySQL Datasource ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- FastAPI AI Service ---
app.ai-service.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.timeout-ms=5000

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Logging ---
logging.level.com.team24.pharma=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- JWT ---
jwt.secret=${JWT_SECRET:8f2a1b9e5d6c7438fa918b9c6d3f2a1e4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e}
jwt.expiration=7200000
