# =====================================================
# PSI - Test Profile Configuration
# Uses H2 in-memory database instead of MySQL
# =====================================================

spring.application.name=pharma-sales-intelligence

# --- H2 In-Memory Datasource ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- Flyway (disabled for tests - H2 incompatible with MySQL DDL) ---
spring.flyway.enabled=false

# --- FastAPI AI Service (dummy for tests) ---
app.ai-service.base-url=http://localhost:9999
app.ai-service.timeout-ms=1000

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173

# --- Logging ---
logging.level.com.team24.pharma=DEBUG

# --- JWT Configuration ---
jwt.secret=8f2a1b9e5d6c7438fa918b9c6d3f2a1e4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e
jwt.expiration=7200000
